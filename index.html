<!doctype html>
<html lang="ar" dir="rtl">

    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manassa Ticket Exchange</title>
    <meta name="description" content="Manassa Ticket Exchange — a trusted marketplace for the resale of travel tickets." />

      (function () {
        var lang = localStorage.getItem('manassa-language')

          document.documentElement.lang = 'en'
          document.documentElement.dir = 'ltr'
        }
      })()
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
